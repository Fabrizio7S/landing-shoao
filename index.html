<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shoao</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://shoaomaple.com/" />

    <!-- Modo oscuro: se aplica antes de pintar la página para que no parpadee en blanco.
         Usa lo que eligió el visitante (botón Claro | Oscuro) o, si nunca eligió, lo de su sistema. -->
    <script>
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "oscuro" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <!-- SEO básico -->
    <meta name="description" content="Shoao es una página informativa creada con React." />
    <meta name="keywords" content="shoao, página informativa, react, web" />
    <meta name="author" content="Fabrizio" />

    <!-- Open Graph (para compartir en redes) -->
    <meta property="og:title" content="Shoao" />
    <meta property="og:description" content="Página informativa creada con React." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shoaomaple.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
