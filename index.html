<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shoao | Guías de bosses de MapleStory en español</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Dirección oficial: www (shoaomaple.com sin www redirige aquí en Vercel) -->
    <link rel="canonical" href="https://www.shoaomaple.com/" />

    <!-- Modo oscuro: se aplica antes de pintar la página para que no parpadee en blanco.
         Usa lo que eligió el visitante (botón Claro | Oscuro) o, si nunca eligió, lo de su sistema. -->
    <script>
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "oscuro" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <!-- SEO básico -->
    <meta name="description" content="Guías de bosses de MapleStory en español por Shoao (Jhohao): Mayrin, Bellona y más, con todos los patrones, mecánicas y recompensas. Videos y setup." />
    <meta name="keywords" content="maplestory, guía, bosses, mayrin, bellona, español, shoao" />
    <meta name="author" content="Fabrizio" />

    <!-- Open Graph (para compartir en redes) -->
    <meta property="og:title" content="Shoao | Guías de bosses de MapleStory en español" />
    <meta property="og:description" content="Guías de bosses de MapleStory en español: patrones, mecánicas y recompensas." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.shoaomaple.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
  </head>
