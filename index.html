<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shoao | Guías de MapleStory GMS en español</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Dirección oficial: www (shoaomaple.com sin www redirige aquí en Vercel) -->
    <link rel="canonical" href="https://www.shoaomaple.com/" />

    <!-- Modo oscuro: se aplica antes de pintar la página para que no parpadee en blanco.
         Usa lo que eligió el visitante (botón Claro | Oscuro) o, si nunca eligió, lo de su sistema. -->
    <script>
      try {
        var tema = localStorage.getItem("tema");
        if (tema === "oscuro" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <!-- SEO básico -->
    <meta name="description" content="Guías de bosses y eventos de MapleStory GMS en español, novedades de GMS y KMS, y servicios de bosseo, leveleo y optimización de cuenta." />
    <meta name="keywords" content="maplestory, gms, kms, guías, bosses, eventos, bosseo, leveleo, español, shoao" />
    <meta name="author" content="Fabrizio" />

    <!-- Open Graph (para compartir en redes) -->
    <meta property="og:title" content="Shoao | Guías de MapleStory GMS en español" />
    <meta property="og:description" content="Guías de bosses y eventos de MapleStory GMS en español, novedades de GMS y KMS, y servicios de bosseo, leveleo y optimización de cuenta." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.shoaomaple.com/" />

    <!-- Datos estructurados para Google: qué es la web y quién es Shoao (con sus redes).
         Si cambian las redes, actualizar también src/data/socials.ts -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.shoaomaple.com/#web",
            "url": "https://www.shoaomaple.com/",

            "description": "Guías de bosses y eventos de MapleStory GMS en español, novedades de GMS y KMS, y servicios de bosseo, leveleo y optimización de cuenta.",

          },
          {
            "@type": "Person",
            "@id": "https://www.shoaomaple.com/#shoao",
            "name": "Shoao",

          }
        ]
      }

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
